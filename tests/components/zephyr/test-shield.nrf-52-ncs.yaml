packages:
  zephyr: !include common.yaml

nrf:
  variant: NRF52
  board: nrf52840dk
  # Mainline Zephyr (not NCS) -- lighter/faster to fetch for this test, and the
  # in-tree nrf7002ek shield used below ships with either SDK's boards/shields/.
  framework:
    type: zephyr
    # nrf52840dk has the Arduino-compatible header nrf7002ek is designed to stack
    # onto -- exercises shields: end to end (west build's -DSHIELD=, and
    # dts_lookup.py's shield-overlay merge) against a real, in-tree shield with no
    # shield_source: override needed.
    shields:
      - nrf7002ek
