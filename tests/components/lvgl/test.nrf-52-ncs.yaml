packages:
  lvgl_package: !include lvgl-package.yaml
  spi: !include ../../test_build_components/common/spi/nrf-52-ncs.yaml
  i2c: !include ../../test_build_components/common/i2c/nrf-52-ncs.yaml
  lvgl: !include common.yaml

nrf:
  board: xiao_ble
  framework:
    advanced:
      bootloader: adafruit_nrf52_sd140_v7

# No network on this board, so a clock chip stands in for SNTP
time:
  - platform: ds1307
    id: sntp_time

display:
  - platform: mipi_spi
    spi_id: spi_bus
    model: st7789v
    id: tft_display
    dimensions:
      width: 240
      height: 320
    data_rate: 8MHz
    cs_pin: 28
    dc_pin: 29
    reset_pin: 35
    auto_clear_enabled: false
    update_interval: never

lvgl:
  displays: tft_display
  buffer_size: 12%
