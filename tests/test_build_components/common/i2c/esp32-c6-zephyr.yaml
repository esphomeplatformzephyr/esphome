# Common I2C configuration for esp32-c6-zephyr tests
# Pins match the board's i2c0_default pinctrl node (esp32c6_devkitc_hpcore-pinctrl.dtsi);
# the board DTS fixes the actual pins, sda/scl here are for logging/display only.

substitutions:
  scl_pin: "7"
  sda_pin: "6"

i2c:
  - id: i2c_bus
    scl: ${scl_pin}
    sda: ${sda_pin}
    scan: true
